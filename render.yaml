services:
  - type: web
    name: gridtweak
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python dlr_v2.8.py --api
    healthCheckPath: /dlr/health
    envVars:
      - key: GRIDTWEAK_AUTO_FRESH
        value: "1"
      - key: PYTHON_VERSION
        value: "3.10.13"